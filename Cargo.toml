[package]
name = "clipsync"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/iyazerski/clipsync"
description = "Keep the clipboards of your computers and an Android phone in sync through a tiny relay"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
clipsync-proto = { path = "proto" }
dirs = "7"
futures-util = "0.3"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5", features = ["std"] }
windows-registry = "0.100"

[lints]
workspace = true

[workspace]
members = [".", "relay", "proto"]

# A panic exits the process, so the background service or Kubernetes restarts it, rather
# than leaving it running with a poisoned lock.
[profile.release]
panic = "abort"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
# Set when building clipsyncw.exe, the Windows background service, which opens no console window.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(windowless)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
