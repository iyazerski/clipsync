# Run with `prek run --all-files` (or `prek install` to run on every commit).
# The license freshness check compares the generated file byte for byte.
exclude: ^THIRD_PARTY_LICENSES\.md$

repos:
  - repo: builtin
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]

      - id: go-test
        name: Go vet and tests
        entry: sh -c 'go vet -mod=readonly ./... && go test -mod=readonly ./...'
        language: system
        pass_filenames: false
        files: ^(cmd/|relay/|internal/|androidbridge/|go\.(mod|sum)$)

      - id: android-lint
        name: Android lint
        entry: sh -c 'cd android && ./gradlew -q lintRelease'
        language: system
        pass_filenames: false
        files: ^(android/|androidbridge/|internal/|go\.(mod|sum)$|scripts/android-aar\.sh$)
