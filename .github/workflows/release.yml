name: Release

# Every push to main that changes the desktop service or the app publishes a
# release v0.1.<run> with all of them, so these links always get the newest:
#   https://github.com/<owner>/<repo>/releases/latest/download/clipsync.apk
#   https://github.com/<owner>/<repo>/releases/latest/download/clipsync-aarch64-apple-darwin.tar.gz
#   https://github.com/<owner>/<repo>/releases/latest/download/clipsync-x86_64-pc-windows-msvc.zip
# It also updates Formula/clipsync.rb in iyazerski/homebrew-tap.
on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "android/**"
      - "androidbridge/**"
      - "scripts/android-aar.sh"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: 0.1.${{ github.run_number }}

jobs:
  mac:
    # Apple silicon only, like the Macs it runs on.
    runs-on: macos-15
    env:
      ASSET: clipsync-aarch64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build binary
        run: |
          mkdir bin
          CGO_ENABLED=0 go build -mod=readonly -trimpath -ldflags "-s -w -X main.version=$VERSION" -o bin/clipsync ./cmd/clipsync
      - name: Test binary
        run: bin/clipsync --version
      - name: Package binary
        run: |
          mkdir dist
          tar -C bin -czf "dist/$ASSET" clipsync
          cd dist
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/*
          if-no-files-found: error

  windows:
    # x86_64 only: Windows on Arm runs it through emulation.
    runs-on: windows-latest
    env:
      ASSET: clipsync-x86_64-pc-windows-msvc.zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # clipsyncw.exe is the same program without a console window.
      - name: Build binaries
        run: |
          mkdir dist
          export CGO_ENABLED=0 GOARCH=amd64
          go build -mod=readonly -trimpath -ldflags "-s -w -X main.version=$VERSION" -o dist/clipsync.exe ./cmd/clipsync
          go build -mod=readonly -trimpath -ldflags "-s -w -H windowsgui -X main.version=$VERSION" -o dist/clipsyncw.exe ./cmd/clipsync
      - name: Test binary
        run: dist/clipsync.exe --version
      - name: Package binaries
        working-directory: dist
        run: |
          7z a "$ASSET" clipsync.exe clipsyncw.exe
          rm clipsync.exe clipsyncw.exe
          sha256sum "$ASSET" > "$ASSET.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CLIPSYNC_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CLIPSYNC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          CLIPSYNC_KEYSTORE_PASSWORD: ${{ secrets.CLIPSYNC_KEYSTORE_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk clipsync.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: android/clipsync.apk
          if-no-files-found: error

  publish:
    needs: [mac, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "clipsync v$VERSION" \
            --notes "Build from ${GITHUB_SHA::7}. Mac: \`brew install iyazerski/tap/clipsync\`, or \`curl -fsSL https://raw.githubusercontent.com/$GH_REPO/main/install.sh | sh\`. Windows: \`irm https://raw.githubusercontent.com/$GH_REPO/main/install.ps1 | iex\`. Phone: open clipsync.apk on the phone and allow installing from this source." \
            --latest

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mac
          path: dist
      - name: Push formula to iyazerski/homebrew-tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          echo "$DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          chmod 600 "$RUNNER_TEMP/tap_key"
          git clone --depth 1 git@github.com:iyazerski/homebrew-tap.git "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          scripts/homebrew-formula.sh "$VERSION" dist > "$RUNNER_TEMP/tap/Formula/clipsync.rb"
          cd "$RUNNER_TEMP/tap"
          git add Formula/clipsync.rb
          if git diff --cached --quiet; then
            echo "Formula is already at $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update clipsync to $VERSION"
          git push
