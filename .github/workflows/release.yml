name: Release

# Ship every asset together so the latest-release download URLs stay valid.
on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "android/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'push' || (github.ref == 'refs/heads/main' && inputs.publish)) && 'release' || format('release-check-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && (github.ref != 'refs/heads/main' || !inputs.publish) }}

env:
  VERSION: 0.1.${{ github.run_number }}
  PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish) }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAC_ASSET: clipsync-aarch64-apple-darwin.tar.gz
      WINDOWS_ASSET: clipsync-x86_64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build and package desktop binaries
        run: |
          mkdir -p bin/mac bin/windows dist
          export CGO_ENABLED=0
          ldflags="-s -w -X main.version=$VERSION"
          GOOS=darwin GOARCH=arm64 go build -mod=readonly -trimpath -ldflags "$ldflags" -o bin/mac/clipsync ./cmd/clipsync
          export GOOS=windows GOARCH=amd64
          go build -mod=readonly -trimpath -ldflags "$ldflags" -o bin/windows/clipsync.exe ./cmd/clipsync
          # The background service must start without a console window.
          go build -mod=readonly -trimpath -ldflags "$ldflags -H windowsgui" -o bin/windows/clipsyncw.exe ./cmd/clipsync
          tar -C bin/mac -czf "dist/$MAC_ASSET" clipsync
          zip -j "dist/$WINDOWS_ASSET" bin/windows/clipsync.exe bin/windows/clipsyncw.exe
          cd dist
          sha256sum "$MAC_ASSET" > "$MAC_ASSET.sha256"
          sha256sum "$WINDOWS_ASSET" > "$WINDOWS_ASSET.sha256"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore release keystore
        if: env.PUBLISH == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.CLIPSYNC_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CLIPSYNC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build Android APK
        working-directory: android
        env:
          CLIPSYNC_KEYSTORE_PASSWORD: ${{ env.PUBLISH == 'true' && secrets.CLIPSYNC_KEYSTORE_PASSWORD || '' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../dist/clipsync.apk
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/${{ env.MAC_ASSET }}*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: windows-and-android
          path: |
            dist/${{ env.WINDOWS_ASSET }}*
            dist/clipsync.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "clipsync v$VERSION" \
            --notes "Build from ${GITHUB_SHA::7}. Mac: \`brew install iyazerski/tap/clipsync\`, or \`curl -fsSL https://raw.githubusercontent.com/$GH_REPO/main/install.sh | sh\`. Windows: \`irm https://raw.githubusercontent.com/$GH_REPO/main/install.ps1 | iex\`. Phone: open clipsync.apk on the phone and allow installing from this source." \
            --latest

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mac
          path: dist
      - name: Push formula to iyazerski/homebrew-tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          echo "$DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          chmod 600 "$RUNNER_TEMP/tap_key"
          git clone --depth 1 git@github.com:iyazerski/homebrew-tap.git "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          scripts/homebrew-formula.sh "$VERSION" dist > "$RUNNER_TEMP/tap/Formula/clipsync.rb"
          cd "$RUNNER_TEMP/tap"
          git add Formula/clipsync.rb
          if git diff --cached --quiet; then
            echo "Formula is already at $VERSION"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update clipsync to $VERSION"
          git push
