name: Release

# Ship every asset in one release, so the latest-release download URLs and the
# apps' update checks always find all of them.
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "internal/**"
      - "android/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'push' || (github.ref == 'refs/heads/main' && inputs.publish)) && 'release' || format('release-check-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && (github.ref != 'refs/heads/main' || !inputs.publish) }}

env:
  # Releases count up from <MINOR>.0. Bump it for a new minor version.
  MINOR: "0.2"
  PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish) }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Pick the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # The next patch after the latest <MINOR>.x release, drafts included. A
        # re-run of this commit gets its version again.
        run: |
          releases=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq "[.[] | select(.tag_name | startswith(\"v$MINOR.\"))]")
          version=$(jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.target_commitish == $sha)][0].tag_name // "" | ltrimstr("v")' <<< "$releases")
          if [ -z "$version" ]; then
            patch=$(jq --arg prefix "v$MINOR." '[.[].tag_name | ltrimstr($prefix) | tonumber? ] | max // -1' <<< "$releases")
            version="$MINOR.$((patch + 1))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"
      # The builds upload to this draft, which stays hidden until every asset is in.
      - name: Create the draft release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "clipsync v$VERSION" --notes-file - <<EOF
          Build from ${GITHUB_SHA::7}.

          ### Downloads
          - **Mac (macOS 13+, Apple silicon & Intel):** [clipsync-$VERSION.dmg](https://github.com/$GH_REPO/releases/download/v$VERSION/clipsync-$VERSION.dmg), or install in Terminal (skips the first-time warning): \`curl -fsSL https://github.com/$GH_REPO/releases/latest/download/install.sh | sh\`
          - **Windows:** [clipsync-setup-$VERSION-amd64.exe](https://github.com/$GH_REPO/releases/download/v$VERSION/clipsync-setup-$VERSION-amd64.exe), or install in PowerShell: \`irm https://github.com/$GH_REPO/releases/latest/download/install.ps1 | iex\`
          - **Android (14+):** [clipsync.apk](https://github.com/$GH_REPO/releases/download/v$VERSION/clipsync.apk) (allow installing from this source when Android asks)

          > The Mac and Windows apps aren't signed yet. If you use the direct installer, on Mac go to **System Settings → Privacy & Security → Open Anyway**, and on Windows click **More info → Run anyway**.
          EOF
          fi

  desktop:
    needs: version
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Disk images need macOS.
          - { name: macOS, os: macos-latest, platform: darwin/universal }
          - { name: Windows, os: ubuntu-latest, platform: windows/amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installer
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Leave Hindi out of the Windows installer
        if: matrix.name == 'Windows'
        # NSIS has no Hindi, and mygo build stops on a language it lacks. The app
        # embeds desktop/locales itself, so only the installer falls back to English.
        run: |
          mkdir -p desktop/build/installer-locales
          cp desktop/locales/*.json desktop/build/installer-locales/
          rm desktop/build/installer-locales/hi.json
          jq '.i18n.dir = "build/installer-locales"' desktop/mygo.json > "$RUNNER_TEMP/mygo.json"
          mv "$RUNNER_TEMP/mygo.json" desktop/mygo.json
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ env.PUBLISH == 'true' && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
        run: |
          upload=
          if [ "$PUBLISH" = true ]; then
            test -n "$MYGO_UPDATER_PRIVATE_KEY"
            upload=-upload
          fi
          jq --arg version "$VERSION" '.version = $version' desktop/mygo.json > "$RUNNER_TEMP/mygo.json"
          mv "$RUNNER_TEMP/mygo.json" desktop/mygo.json
          go tool mygo build -platform "${{ matrix.platform }}" $upload desktop
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH != 'true'
        with:
          name: ${{ matrix.name }}
          path: |
            desktop/build/*/*.dmg
            desktop/build/*/*setup*.exe
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore release keystore
        if: env.PUBLISH == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.CLIPSYNC_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CLIPSYNC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build Android APK
        working-directory: android
        env:
          CLIPSYNC_KEYSTORE_PASSWORD: ${{ env.PUBLISH == 'true' && secrets.CLIPSYNC_KEYSTORE_PASSWORD || '' }}
          # versionCode, which must grow with every release.
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/clipsync.apk
      - name: Upload to the draft release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "v$VERSION" dist/clipsync.apk --clobber
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH != 'true'
        with:
          name: android
          path: dist/clipsync.apk
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [version, desktop, android]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Both desktop jobs merge their lines into SHA256SUMS. If they upload at the
          # same moment, one can drop the other's. install.ps1 needs the Windows setup
          # line: re-run the macOS job if this fails.
          gh release download "v$VERSION" --pattern SHA256SUMS --output - | grep -q "setup-$VERSION-amd64\.exe$"
          gh release edit "v$VERSION" --draft=false --latest
