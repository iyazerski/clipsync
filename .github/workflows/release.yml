name: Release

# Every push to main that changes the Mac service or the app publishes a
# release v0.1.<run> with both, so these links always get the newest:
#   https://github.com/<owner>/<repo>/releases/latest/download/clipsync.apk
#   https://github.com/<owner>/<repo>/releases/latest/download/clipsync-aarch64-apple-darwin.tar.gz
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "proto/**"
      - "android/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: 0.1.${{ github.run_number }}

jobs:
  mac:
    # Apple silicon only, like the Macs it runs on.
    runs-on: macos-15
    env:
      TARGET: aarch64-apple-darwin
      ASSET: clipsync-aarch64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - name: Build binary
        env:
          CLIPSYNC_VERSION: ${{ env.VERSION }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Test binary
        run: target/$TARGET/release/clipsync --version
      - name: Package binary
        run: |
          mkdir dist
          tar -C "target/$TARGET/release" -czf "dist/$ASSET" clipsync
          cd dist
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CLIPSYNC_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CLIPSYNC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          CLIPSYNC_KEYSTORE_PASSWORD: ${{ secrets.CLIPSYNC_KEYSTORE_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk clipsync.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: android/clipsync.apk
          if-no-files-found: error

  publish:
    needs: [mac, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "clipsync v$VERSION" \
            --notes "Build from ${GITHUB_SHA::7}. Mac: \`curl -fsSL https://raw.githubusercontent.com/$GH_REPO/main/install.sh | sh\`. Phone: open clipsync.apk on the phone and allow installing from this source." \
            --latest
