name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format and licenses
        if: runner.os == 'Linux'
        run: |
          test -z "$(gofmt -l cmd internal relay androidbridge)"
          make licenses
          git diff --exit-code THIRD_PARTY_LICENSES.md
      - run: go vet -mod=readonly ./...
      - if: runner.os != 'Windows'
        run: go test -mod=readonly -race ./...
      - if: runner.os == 'Windows'
        run: go test -mod=readonly ./...

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Android lint
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon lintRelease
