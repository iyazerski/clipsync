name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check Android inputs
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Compare the PR merge commit with its first parent (the base branch).
          if [[ "$EVENT_NAME" == pull_request ]] &&
            git diff --quiet HEAD^1 HEAD -- android/ internal/syncer/testdata/ .github/workflows/ci.yml; then
            echo 'android=false' >> "$GITHUB_OUTPUT"
          else
            echo 'android=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format and licenses
        run: |
          test -z "$(gofmt -l desktop internal relay)"
          make licenses
          git diff --exit-code THIRD_PARTY_LICENSES.md
      - name: Vet and test Go
        run: |
          go vet -mod=readonly ./...
          go test -mod=readonly -race ./...
      - name: Check the desktop app
        run: |
          cd desktop
          go tool mygo i18n check
          go tool mygo generate
          git diff --exit-code locales
          cd ..
          export CGO_ENABLED=0
          for target in darwin/arm64 darwin/amd64 windows/amd64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            go vet -mod=readonly ./desktop
            go test -mod=readonly -c -o "$RUNNER_TEMP/clipsync-$GOOS-$GOARCH.test" ./desktop
          done
      - uses: actions/setup-java@v6
        if: steps.changes.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        if: steps.changes.outputs.android == 'true'
      - name: Android lint and tests
        if: steps.changes.outputs.android == 'true'
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon lintRelease testDebugUnitTest
