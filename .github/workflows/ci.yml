name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format and licenses
        run: |
          test -z "$(gofmt -l cmd internal relay)"
          make licenses
          git diff --exit-code THIRD_PARTY_LICENSES.md
      - name: Vet and test Go
        run: |
          go vet -mod=readonly ./...
          go test -mod=readonly -race ./...
      - name: Check desktop targets
        run: |
          export CGO_ENABLED=0
          for target in darwin/arm64 windows/amd64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            go vet -mod=readonly ./cmd/clipsync
            go test -mod=readonly -c -o "$RUNNER_TEMP/clipsync-$GOOS.test" ./cmd/clipsync
          done
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Android lint and tests
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon lintRelease testDebugUnitTest
