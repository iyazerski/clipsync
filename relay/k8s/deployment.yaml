apiVersion: apps/v1
kind: Deployment
metadata:
  name: clipsync-relay
  labels:
    app.kubernetes.io/part-of: clipsync
    app: clipsync-relay
spec:
  replicas: 1
  # One process holds the latest clip and every device's stream: never run two.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clipsync-relay
  template:
    metadata:
      labels:
        app: clipsync-relay
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: clipsync-relay
          image: __APP_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # `clipsync token` on a Mac; see README.
            - name: CLIPSYNC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clipsync-relay-secrets
                  key: CLIPSYNC_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 250m
              memory: 64Mi
