apiVersion: apps/v1
kind: Deployment
metadata:
  name: clipsync-relay
  labels:
    app.kubernetes.io/part-of: clipsync
    app: clipsync-relay
spec:
  replicas: 1
  # One process holds the latest clip and every device's stream: never run two.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clipsync-relay
  template:
    metadata:
      labels:
        app: clipsync-relay
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: clipsync-relay
          image: __APP_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CLIPSYNC_PUBLIC
              value: "true"
            # Collect garbage harder before reaching the memory limit.
            - name: GOMEMLIMIT
              value: 200MiB
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            # Fits the relay's own caps: 4,096 streams at about 30 KiB each and 32 MiB of clips.
            limits:
              cpu: 500m
              memory: 256Mi
