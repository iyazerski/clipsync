apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: clipsync-relay-web
  labels:
    app.kubernetes.io/part-of: clipsync
    app: clipsync-relay
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`__PUBLIC_HOST__`)
      kind: Rule
      middlewares:
        - name: clipsync-relay-https-redirect
      services:
        - name: clipsync-relay
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: clipsync-relay-websecure
  labels:
    app.kubernetes.io/part-of: clipsync
    app: clipsync-relay
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`__PUBLIC_HOST__`)
      kind: Rule
      middlewares:
        - name: clipsync-relay-security-headers
        - name: clipsync-relay-rate-limit
      services:
        - name: clipsync-relay
          port: 8080
  tls:
    secretName: clipsync-relay-tls
