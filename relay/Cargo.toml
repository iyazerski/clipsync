[package]
name = "clipsync-relay"
version = "0.1.0"
edition = "2024"
publish = false
description = "A tiny relay that passes sealed clipboard text between your devices"

[dependencies]
clipsync-proto = { path = "../proto" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
ring = "0.17"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }

[lints]
workspace = true

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
